<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="fahhh!">
<meta name="theme-color" content="#ffffff">
<title>fahhh!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iansui&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;background:#fff;color:#000;font-family:'Comic Sans MS','Comic Sans','Iansui','Comic Neue',cursive,sans-serif}
body{max-width:560px;margin:0 auto;padding:16px 16px 150px}
h1{display:flex;align-items:center;gap:10px;margin:6px 0 4px;font-size:46px;letter-spacing:-1px}
.sub{margin:0 0 14px;font-size:14px;line-height:1.5}
.btn{font:inherit;font-weight:bold;color:#000;background:#fff;border:3px solid #000;cursor:pointer;padding:8px 14px;border-radius:255px 15px 225px 15px/15px 225px 15px 255px}
.btn:not(.item):not(#fab):active{transform:translate(2px,2px)}
.flash{background:#FF0000 !important;color:#fff}
#up{width:100%;font-size:20px;padding:14px}
.row{display:flex;align-items:center;gap:10px;border:3px solid #000;padding:10px;margin:14px 0;border-radius:15px 255px 15px 225px/225px 15px 255px 15px}
.row:nth-child(even){border-radius:255px 15px 225px 15px/15px 225px 15px 255px}
.row .play{width:58px;height:58px;padding:0;font-size:28px;flex:none}
.nm{flex:1;min-width:0;font-size:18px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{padding:6px 10px;font-size:16px}
.eq{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:14px;font-weight:bold;flex:none}
.eq input{position:absolute;opacity:0;pointer-events:none}
.eq b{display:inline-block;position:relative;width:32px;height:32px;border:3px solid #000;background:#fff;border-radius:255px 15px 225px 15px/15px 225px 15px 255px}
.eq input:checked+b::after{content:'X';position:absolute;inset:0;display:grid;place-items:center;color:#FF0000;font-size:26px;font-weight:bold;line-height:1}
.note{border:3px dashed #000;padding:10px;font-size:13px;line-height:1.5;margin-top:18px;border-radius:15px 255px 15px 225px/225px 15px 255px 15px}
/* 小白點 */
#bd{position:fixed;inset:0;display:none;z-index:50;background:rgba(255,255,255,.85)}
#dock{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:68px;height:68px;z-index:100}
#fab{position:absolute;inset:0;padding:0;display:grid;place-items:center;border-width:4px;border-radius:60% 40% 55% 45%/50% 60% 40% 50%;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.open #fab{transform:rotate(-14deg) scale(.92)}
#ring{position:absolute;left:34px;top:34px;width:0;height:0}
.item{position:absolute;left:-27px;top:-27px;width:54px;height:54px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;opacity:0;pointer-events:none;
 transform:rotate(var(--a)) translateX(0) rotate(calc(-1 * var(--a))) scale(.2);
 transition:transform .55s cubic-bezier(.34,1.56,.64,1) calc(var(--i) * 45ms),opacity .2s calc(var(--i) * 45ms)}
.open .item{opacity:1;pointer-events:auto;transform:rotate(var(--a)) translateX(var(--r)) rotate(calc(-1 * var(--a))) scale(1)}
.item i{font-style:normal;font-size:22px}
.item u{text-decoration:none;font-size:9px;max-width:46px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-top:2px}
#empty{display:none;position:absolute;right:78px;bottom:14px;width:170px;padding:8px;font-size:13px;font-weight:bold;background:#fff;border:3px solid #000;border-radius:255px 15px 225px 15px/15px 225px 15px 255px;text-align:center}
.open #empty.show{display:block}

/* 迷因人物 */
html{overflow-x:hidden}
.wj{position:absolute;z-index:0;pointer-events:none;mix-blend-mode:multiply;max-width:none}
.hd{position:relative}
.hd h1,.hd .sub,#up,.row,.note{position:relative;z-index:1}
.row,.note{background:#fff}
.hd .sub{max-width:64%}
#wjB{right:-16px;top:-6px;width:118px;--r:6deg;transform:rotate(var(--r));animation:wob 1.7s steps(1,end) infinite}
.ft{position:relative;height:130px}
#wjA{left:-14px;bottom:-150px;width:130px;--r:-4deg;transform:rotate(var(--r));animation:wob 1.1s steps(1,end) infinite}
@keyframes wob{0%{transform:rotate(var(--r))}50%{transform:rotate(calc(var(--r) + 3deg))}}
@media (prefers-reduced-motion:reduce){.wj{animation:none !important}}
@media (min-width:820px){
 .hd .sub{max-width:none}
 .wj{position:fixed}
 .ft{height:0}
 #wjA{left:2vw;bottom:-5vh;top:auto;width:clamp(100px,calc((100vw - 560px)/2 - 20px),280px);--r:-5deg}
 #wjB{right:3vw;left:auto;top:11vh;width:clamp(90px,calc((100vw - 560px)/2 - 40px),230px);--r:7deg}
}

#credit{position:fixed;z-index:40;right:calc(96px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;padding:6px 12px 6px 10px;background:#fff;color:#000;border:3px solid #000;border-radius:15px 255px 15px 225px/225px 15px 255px 15px;transform:rotate(-2deg);font-size:12px;font-weight:bold;pointer-events:none}
#credit img{height:30px;width:auto;display:block}
</style>
</head>

</defs></svg>

var custom=[];
function all(){return BUILTIN.concat(custom)}

function loadBuf(s){
  if(!s.data||buf[s.id])return;
  var c=getCtx();
  fetch(s.data).then(function(r){return r.arrayBuffer()})
    .then(function(ab){return new Promise(function(ok,no){var p=c.decodeAudioData(ab,ok,no);if(p&&p.then)p.then(ok,no)})})
    .then(function(b){buf[s.id]=b}).catch(function(){buf[s.id]=null});
}
function flash(el){el.classList.add('flash');setTimeout(function(){el.classList.remove('flash')},110)}
function play(s,el){
  flash(el);
  if(navigator.vibrate)try{navigator.vibrate(50)}catch(e){}
  var c=getCtx();
  if(s.fn){s.fn(c);return}
  var b=buf[s.id];
  if(b){var src=c.createBufferSource();src.buffer=b;src.connect(master);src.start()}
  else{try{new Audio(s.data).play().catch(function(){})}catch(e){}loadBuf(s)}
}

/* ---------- 儲存 ---------- */
var db=null,eq=null;
try{eq=JSON.parse(localStorage.getItem('fahhh_eq'))}catch(e){}
if(!Array.isArray(eq))eq=BUILTIN.map(function(s){return s.id});
function saveEq(){try{localStorage.setItem('fahhh_eq',JSON.stringify(eq))}catch(e){}}
function openDB(){return new Promise(function(r){try{
  var q=indexedDB.open('fahhh',1);
  q.onupgradeneeded=function(){q.result.createObjectStore('sounds',{keyPath:'id'})};
  q.onsuccess=function(){r(q.result)};q.onerror=function(){r(null)};
}catch(e){r(null)}})}
function dbAll(){return new Promise(function(r){
  if(!db)return r([]);
  try{var q=db.transaction('sounds').objectStore('sounds').getAll();q.onsuccess=function(){r(q.result||[])};q.onerror=function(){r([])}}catch(e){r([])}
})}
function dbPut(o){try{db&&db.transaction('sounds','readwrite').objectStore('sounds').put(o)}catch(e){}}
function dbDel(id){try{db&&db.transaction('sounds','readwrite').objectStore('sounds').delete(id)}catch(e){}}

/* ---------- 資料庫清單 ---------- */
function renderList(){
  var L=$('#list');L.innerHTML='';
  all().forEach(function(s){
    var row=document.createElement('div');row.className='row';
    row.innerHTML='<button class="btn play">'+(s.emo||'🎵')+'</button><div class="nm">'+esc(s.name)+'</div>'+
      (s.fn||s.lock?'':'<button class="btn del">🗑</button>')+
      '<label class="eq"><input type="checkbox"'+(eq.indexOf(s.id)>-1?' checked':'')+'><b></b>裝備</label>';
    var p=row.querySelector('.play');
    p.addEventListener('pointerdown',function(e){e.preventDefault();play(s,p)});
    row.querySelector('input').addEventListener('change',function(e){
      var i=eq.indexOf(s.id);
      if(e.target.checked&&i<0)eq.push(s.id);
      if(!e.target.checked&&i>-1)eq.splice(i,1);
      saveEq();renderMenu();
    });
    var d=row.querySelector('.del');
    if(d)d.addEventListener('click',function(){
      if(!confirm('刪除「'+s.name+'」？(つД｀)'))return;
      custom=custom.filter(function(x){return x.id!==s.id});
      eq=eq.filter(function(x){return x!==s.id});
      delete buf[s.id];dbDel(s.id);saveEq();renderList();renderMenu();
    });
    L.appendChild(row);
  });
}

/* ---------- 輪狀選單 ---------- */
var dock=$('#dock'),ring=$('#ring');
function renderMenu(){
  ring.innerHTML='';
  var list=all().filter(function(s){return eq.indexOf(s.id)>-1});
  $('#empty').classList.toggle('show',list.length===0);
  var caps=[4,6,8],rad=[110,185,260],idx=0,r=0,n=list.length,k=0;
  while(idx<n){
    var cap=r<2?caps[r]:n-idx,take=Math.min(cap,n-idx);
    for(var j=0;j<take;j++){
      var s=list[idx+j],ang=take===1?225:180+90*j/(take-1);
      var b=document.createElement('button');b.className='btn item';
      b.style.setProperty('--a',ang+'deg');
      b.style.setProperty('--r',rad[Math.min(r,2)]+'px');
      b.style.setProperty('--i',k++);
      b.innerHTML='<i>'+(s.emo||'🎵')+'</i><u>'+esc(s.name)+'</u>';
      (function(s,b){
        b.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();play(s,b)});
        b.addEventListener('contextmenu',function(e){e.preventDefault()});
      })(s,b);
      ring.appendChild(b);
    }
    idx+=take;r++;
  }
}
function setOpen(v){dock.classList.toggle('open',v);$('#bd').style.display=v?'block':'none'}
$('#fab').addEventListener('pointerdown',function(e){
  e.preventDefault();getCtx();setOpen(!dock.classList.contains('open'));
});
$('#bd').addEventListener('pointerdown',function(e){e.preventDefault();setOpen(false)});

/* ---------- 上傳 ---------- */
$('#up').addEventListener('click',function(){$('#file').click()});
$('#file').addEventListener('change',async function(e){
  var files=Array.prototype.slice.call(e.target.files);
  for(var f of files){
    if(f.type.indexOf('audio')!==0&&!/\.(mp3|m4a|wav|ogg|aac|flac|caf)$/i.test(f.name))continue;
    var data=await new Promise(function(r){var fr=new FileReader();fr.onload=function(){r(fr.result)};fr.readAsDataURL(f)});
    var s={id:'c'+Date.now()+Math.random().toString(36).slice(2,6),name:f.name.replace(/\.[^.]+$/,'').slice(0,14),data:data};
    custom.push(s);dbPut(s);eq.push(s.id);loadBuf(s);
  }
  saveEq();renderList();renderMenu();e.target.value='';
});

/* ---------- 啟動 ---------- */
document.addEventListener('contextmenu',function(e){e.preventDefault()});
renderList();renderMenu();BUILTIN.forEach(loadBuf);
openDB().then(function(d){db=d;return dbAll()}).then(function(rows){
  custom=rows.sort(function(a,b){return a.id<b.id?-1:1});
  var ids=all().map(function(s){return s.id});
  eq=eq.filter(function(x){return ids.indexOf(x)>-1});
  renderList();renderMenu();custom.forEach(loadBuf);
});
})();
